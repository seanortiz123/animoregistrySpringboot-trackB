spring.datasource.username=${DB_USERNAME:postgres.ikratbviovmuynuoeyok}
spring.datasource.password=${DB_PASSWORD:azcsJHUepmIqqxXP}
spring.datasource.driver-class-name=org.postgresql.Driver

