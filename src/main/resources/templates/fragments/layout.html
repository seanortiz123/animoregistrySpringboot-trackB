<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>fragments</title></head>
<body>

<!-- ============ HEAD FRAGMENT ============ -->
<th:block th:fragment="pageHead(title)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${title} + ' — AnimoRegistry'">AnimoRegistry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/theme.css}" />
</th:block>

<!-- ============ NAVBAR FRAGMENT ============ -->
<nav th:fragment="nav(active)" class="navbar">
  <div class="wrap">
    <a class="brand" th:href="@{/}"><span class="dot"></span>AnimoRegistry</a>
    <div class="nav-links">
      <a th:href="@{/}" th:classappend="${active == 'home'} ? 'active' : ''">Browse orgs</a>
      <a th:href="@{/about}" th:classappend="${active == 'about'} ? 'active' : ''">About us</a>

      <th:block th:if="${currentRole == null}">
        <a th:href="@{/login}" th:classappend="${active == 'login'} ? 'active' : ''">Log in</a>
        <a th:href="@{/register}" th:classappend="${active == 'register'} ? 'active' : ''">Register</a>
      </th:block>

      <th:block th:if="${currentRole == 'student'}">
        <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active' : ''">My dashboard</a>
        <a th:href="@{/logout}">Log out (<span th:text="${currentName}">name</span>)</a>
      </th:block>

      <th:block th:if="${currentRole == 'officer'}">
        <a th:href="@{/officer}" th:classappend="${active == 'officer'} ? 'active' : ''">Officer panel</a>
        <a th:href="@{/logout}">Log out (<span th:text="${currentName}">name</span>)</a>
      </th:block>
    </div>
  </div>
</nav>

</body>
</html>
