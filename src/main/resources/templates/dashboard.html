<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('dashboard')}"></nav>

<main class="page-body">
  <div class="wrap" style="padding-top:28px">
    <span class="eyebrow">Applicant dashboard</span>
    <h1 style="margin-top:4px;margin-bottom:24px" th:text="'Welcome back, ' + ${currentName}">My applications</h1>

    <div class="stat-grid" style="margin-bottom:28px">
      <div class="stat"><div class="num" th:text="${#lists.size(applications)}">0</div><div class="label">Total</div></div>
      <div class="stat"><div class="num" th:text="${pendingCount}">0</div><div class="label">Pending</div></div>
      <div class="stat"><div class="num" th:text="${interviewCount}">0</div><div class="label">Interview</div></div>
      <div class="stat"><div class="num" th:text="${acceptedCount}">0</div><div class="label">Accepted</div></div>
    </div>

    <div th:if="${#lists.isEmpty(applications)}" class="empty-state">
      <span class="eyebrow">Nothing here yet</span>
      <p>You haven't applied to any organizations. <a th:href="@{/}" style="color:var(--gold)">Browse orgs →</a></p>
    </div>

    <div class="app-row" th:each="a : ${applications}">
      <div class="app-row-top">
        <div>
          <div class="name" th:text="${a.organization.name}">Org</div>
          <div class="sub" th:text="'Applied ' + ${#temporals.format(a.dateApplied, 'MMM d, yyyy h:mm a')}">Applied</div>
        </div>
        <span class="badge" th:classappend="${a.status}" th:text="${a.status}">STATUS</span>
      </div>
      <div class="sub" style="margin-top:8px" th:if="${a.interviewSchedule}"
           th:text="'Interview: ' + ${#temporals.format(a.interviewSchedule, 'MMM d, yyyy h:mm a')}">Interview</div>
      <p class="answers" th:if="${a.answers}" th:text="${a.answers}">Answers</p>
      <div class="actions">
        <a class="muted" style="font-size:13px" th:href="@{/organizations/{id}(id=${a.organization.id})}">View organization →</a>
      </div>
    </div>
  </div>
</main>

</body>
</html>
